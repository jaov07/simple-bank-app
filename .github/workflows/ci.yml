name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    api:
        name: API (lint + testes)
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        env:
            DBHOST: 127.0.0.1
            DBPORT: 3306
            DBUSER: root
            DBPASSWORD: root
            DATABASENAME: simplebank_test
            JWT_SECRET: segredo-de-ci

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm test

    web:
        name: Frontend (build)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - run: npm ci
            - run: npm run build
